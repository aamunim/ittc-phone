# 🎓 ITTC Phone: build the APK, signed with the ITTC Admission Tracker's key
#  - every push / pull request: build (a signed APK is kept as a workflow artifact)
#  - a tag "v1.2.3": the same, and a GitHub Release with the APK
#    (the Tracker's "Get ITTC Phone" button opens /releases/latest)
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The key never enters the repository: it is written to a temp file for this run only
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ITTC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ittc.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/ittc.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key (secrets not available): the APK will be unsigned."
          fi

      - name: Build the APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ITTC_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ITTC_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ITTC_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFossRelease

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/ittc.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ittc-phone-apk
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/foss/release/*.apk "ITTC-Phone-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "ITTC-Phone-${GITHUB_REF_NAME}.apk" \
            --title "ITTC Phone ${GITHUB_REF_NAME}" \
            --notes "Install on Android, then open it and make it the phone app. Source: this repository (GPL-3.0), based on Fossify Phone."
