# 🎓 ITTC Phone: build the APK, signed with the ITTC Admission Tracker's key
#  - every push / pull request: build (the signed APK is kept as a workflow artifact)
#  - a tag "v1.2.3" (must match VERSION_NAME in gradle.properties): the same, then a
#    GitHub Release with the APK — the Tracker's "Get ITTC Phone" button opens /releases/latest
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: A release tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but VERSION_NAME=$have in gradle.properties (raise VERSION_NAME and VERSION_CODE first)"
            exit 1
          fi

      # The key never enters the repository: a temp file for this run only
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ITTC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ittc.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/ittc.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::No signing key: a release must be signed (secret ITTC_KEYSTORE_BASE64)."
            exit 1
          else
            echo "::warning::No signing key (secrets not available): the APK will be unsigned."
          fi

      - name: Build the APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ITTC_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ITTC_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ITTC_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFossRelease

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/ittc.jks"

      - name: Who signed it
        if: env.SIGNING_STORE_FILE != ''
        run: |
          ls -la app/build/outputs/apk/foss/release/
          apk="$(ls app/build/outputs/apk/foss/release/*.apk | head -1)"
          # (the newest build-tools: there may be several)
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "Checking $apk with $apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/sig.txt" 2>&1 || true
          grep -v "^WARNING" "$RUNNER_TEMP/sig.txt" | head -40
          # (apksigner writes "Signer #1 certificate …" or "V2 Signer: certificate …" by version)
          if ! grep -q "^Verifies" "$RUNNER_TEMP/sig.txt" || ! grep -qE "[Ss]igner.*certificate SHA-256 digest" "$RUNNER_TEMP/sig.txt"; then
            echo "::error::The APK is not signed (see above)."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ittc-phone-apk
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ittc-phone-apk
          path: apk
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/*.apk "ITTC-Phone-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "ITTC-Phone-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ITTC Phone ${GITHUB_REF_NAME}" \
            --notes "Install on Android, then open it and make it the phone app. Source: this repository (GPL-3.0), based on Fossify Phone."
