# 🎓 ITTC Phone: build it, and send it to Google Play (app id com.abamunim.ittcphone)
#  - every push / pull request: build (a test APK and the Play bundle .aab are kept as artifacts)
#  - 📱 Google Play: Actions → Build → Run workflow (branch main) → "Google Play track":
#      internal = Internal testing · alpha = Closed testing · production = everyone (later)
#    The very first bundle of a new app is uploaded by hand in Play Console (Google's rule):
#    download "ittc-phone-play" from this run's Artifacts and upload the .aab there.
#  - GitHub Releases with an APK are no longer made (ITTC Phone comes from Google Play).
#  - Version code = 1000 + the run number (a new one each run). "Re-run jobs" keeps the number:
#    after an upload that reached Play, run the workflow again instead. If this file is ever
#    renamed (the run numbers start again at 1), raise the 1000 below past Play's last code.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Google Play track (none = only build)'
        type: choice
        options: [none, internal, alpha, production]
        default: none
      play_status:
        description: 'Release status on Play (draft until the app has been reviewed once)'
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        env:
          HAS_URL: ${{ secrets.SUPABASE_URL != '' }}
          HAS_KEY: ${{ secrets.SUPABASE_ANON_KEY != '' }}
        run: |
          echo "ITTC Phone $(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2), version code $((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_STEP_SUMMARY"
          # (yes / no only — never the values: without both, the build has no ITTC sign-in)
          if [ "$HAS_URL" = "true" ] && [ "$HAS_KEY" = "true" ]; then
            echo "ITTC sign-in: on (SUPABASE_URL and SUPABASE_ANON_KEY are set)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ITTC sign-in: OFF — add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::ITTC sign-in is off in this build: the SUPABASE_URL / SUPABASE_ANON_KEY secrets are missing"
          fi

      - name: To Google Play from main only
        if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run it on the main branch to send it to Google Play (now: $GITHUB_REF_NAME)."
            exit 1
          fi

      # The key never enters the repository: a temp file for this run only
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ITTC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ittc.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/ittc.jks" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name == 'workflow_dispatch' && inputs.play_track != 'none' }}" = "true" ]; then
            echo "::error::No signing key: Google Play needs a signed bundle (secret ITTC_KEYSTORE_BASE64)."
            exit 1
          else
            echo "::warning::No signing key (secrets not available): the build will be unsigned."
          fi

      - name: Build the APK and the Play bundle
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ITTC_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ITTC_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ITTC_KEYSTORE_PASSWORD }}
          # (the ITTC server for signing in by itself; empty in forks: the option is hidden)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          # (Google Play wants a new version code on every upload: 1000 + this run's number)
          ./gradlew --no-daemon -PVERSION_CODE=$((1000 + GITHUB_RUN_NUMBER)) assembleFossRelease bundleFossRelease

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/ittc.jks"

      - name: Who signed it
        if: env.SIGNING_STORE_FILE != ''
        run: |
          apk="$(ls app/build/outputs/apk/foss/release/*.apk | head -1)"
          # (the newest build-tools: there may be several)
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/sig.txt" 2>&1 || true
          grep -v "^WARNING" "$RUNNER_TEMP/sig.txt" | head -20
          if ! grep -q "^Verifies" "$RUNNER_TEMP/sig.txt" || ! grep -qE "[Ss]igner.*certificate SHA-256 digest" "$RUNNER_TEMP/sig.txt"; then
            echo "::error::The APK is not signed (see above)."
            exit 1
          fi
          ls -la app/build/outputs/bundle/fossRelease/

      # 🧪 an APK to try on a phone (signed with the upload key: it is not the Play one, so it
      #   does not update a Play install and the Tracker accepts it as the upload key's)
      - uses: actions/upload-artifact@v4
        with:
          name: ittc-phone-apk
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

      # 📦 the bundle for Google Play, with R8's mapping (to read crash reports)
      - uses: actions/upload-artifact@v4
        with:
          name: ittc-phone-play
          path: |
            app/build/outputs/bundle/fossRelease/*.aab
            app/build/outputs/mapping/fossRelease/mapping.txt
          if-no-files-found: error

      - name: Check the Google Play key
        id: play
        if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is missing in this repository (Settings → Secrets → Actions). The .aab is in Artifacts."
            exit 1
          fi
          echo "AAB=$(ls app/build/outputs/bundle/fossRelease/*.aab | head -1)" >> "$GITHUB_ENV"

      # 🚀 Google Play (the bundle is already kept above: a failed upload loses nothing)
      - name: Upload to Google Play (${{ inputs.play_track }})
        if: steps.play.outcome == 'success'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.abamunim.ittcphone
          releaseFiles: ${{ env.AAB }}
          mappingFile: app/build/outputs/mapping/fossRelease/mapping.txt
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
